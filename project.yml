name: BarrioFantasia
options:
  bundleIdPrefix: com.barriofantasia
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: YES

targets:
  BarrioFantasia:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BarrioFantasia
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barriofantasia.app
        PRODUCT_NAME: BarrioFantasia
        INFOPLIST_FILE: BarrioFantasia/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
