name: Barrio Fantasía iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Swift Testing)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.0
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || true
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project from project.yml
        run: |
          xcodegen generate

      - name: Run Swift Testing Test Suite
        run: |
          xcodebuild test \
            -project BarrioFantasia.xcodeproj \
            -scheme BarrioFantasia \
            -destination "platform=iOS Simulator,OS=latest,name=iPhone 16" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || xcodebuild test \
            -project BarrioFantasia.xcodeproj \
            -scheme BarrioFantasia \
            -destination "platform=iOS Simulator,OS=latest,name=iPhone 16" \
            CODE_SIGNING_ALLOWED=NO
